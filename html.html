<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .holder{
            width: 100%;
            height: auto;
            background-color: red;
            padding: 10px 0;
            display: flex;
            justify-content:center;
            align-items: center;
            flex-direction: column;
        }
        .buttonContainer{
            width: 300px;
            height: 300px;
            background-color: rgb(0, 255, 55);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .buttonContainer button{
            padding: 15px 20px;
            border-radius: 10px;
            background-color: saddlebrown;
            color:white;
            border: none;
            font-size: 1.5rem;
        }
</style>
</head>
<body>
    <!--<div class="buttonHolder" id="buttonWrapper">
        <button id="button">Click</button>
    </div> -->
    <div class="holder">
        <h1 id="head">Introduction to javascript</h1>
        <div class="buttonContainer" id="textHolder">
            <div class="score">
                 <button id="button" onclick="addPointA()">Click</button>
                <p id="teamAParagraph">0</p>
                </div>
            <div class="score2">
                <button onclick="addpointB()">Click</button>
                <p id="teamBParagraph">0</p>
            </div>
        </div>
    </div>
    <script>
        // const button = document.getElementById("button");
        // const div = document.getElementById("buttonWrapper");
        // button.addEventListener("click",()=>{
        //     div.style.backgroundColor = "blue";
        // })   
        const btn = document.getElementById("button");
        const textHolder = document.getElementById("textHolder");
        const head = document.getElementById("head");
        const teamAParagraph= document.getElementById("teamAParagraph");
        const teamBParagraph= document.getElementById("teamBParagraph"); 
        btn.addEventListener("click",()=>{
            textHolder.style.backgroundColor = "blue";
            head.textContent = "Heelo";
        });

        // function greetings(){
        //     const greetings = "Good Morning";
        //     alert(greetings);
        // }     
        let teamA = 0;
        let teamB = 0;
        function addPointA(){
            teamA ++;
            teamAParagraph.textContent = teamA;
            console.log(teamA);
        }
        function addpointB(){
            teamB ++;
            teamBParagraph.textContent = teamB;
            console.log(teamB);
        }
    </script>
</body>
</html>
