<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        box-sizing: border-box;
        margin: 0;
        padding:0;
    }
    .navigation{
        margin:10px;
    }
    .navigation-bar{
        width:100%;
        height:100%;
        font-size: 0.82;
    }
    .nav{
        width:100%;
        height:100%;  
        background-color: black;
        padding: 20px;
        border-radius: 10px;
    }
    .nav ul,li{
        text-decoration: none;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .nav a{
        background-color: red;
        padding: 10px;
        border-radius: 10px;
        font-size: 1.4rem;
        text-decoration: none;
        color: white;
    }
    .nav a:hover{
        background-color: rgb(152, 9, 9);
    }
    .cover{
        width:100%;
        height: 100%;
        background-color: black;
        opacity:0.1;
        color: white;
        text-align: center;
        padding: 10%;
        margin: 10px auto;
    }
    .cover h1{
        font-size: 1.9;
    }
    .section-service{
    width:100%;
    height: auto;
}
.section-wrapper{
    width: 1200px;
    height: auto;
    padding: 20px;
    margin: auto;
}
.section-wrapper h1{
    text-align: center;
}
.service-content{
    width: 100%;
    height: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.services-card{
    width: 340px;
    height: 400px;
    margin-top: 20px;
    background-color: rgb(233, 229, 229);
    border-radius: 10px;
    padding: 10px;
}
.image-card{
    width:100%;
    height: 60%;
    border-radius: 10px;
}
.content-card{
    width: 100%;
    height: 30%;
    padding: 5px;
}
.content-button{
    width: 100%;
    height: 10%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding-top: 10px;
}
.content-button button{
    padding: 10px 20px;
    border: none;
    box-shadow: 0px 10px 12px white;
    border-radius: 10px;
    background-color: red;
    font-size: 1.2rem;
    color: white;
    cursor: pointer;
}
.content-card p{
    font-size: 1.8rem;
    text-align: center;   
}
.image-card img{
    width: 100%;
    height: 100%;
    border-radius: 10px;
    object-fit: cover;
}
footer{
    text-align: center;
    background-color: black;
    color: white;
    padding:20px;
}
</style>
<body>
    <div class="navigation">
